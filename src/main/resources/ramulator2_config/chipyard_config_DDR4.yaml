frontend:
  impl: External
  clock_ratio: 8
memory_system:
  impl: GenericDRAM
  clock_ratio: 3
  channel_mapper:
    impl: CacheLineInterleave
    interleave_bits: 0
  controllers:
    - impl: GenericDDR
      wr_low_watermark: 0.2
      wr_high_watermark: 0.8
      read_buffer_size: 32
      write_buffer_size: 32
      priority_buffer_size: 1568
      scheduler:
        impl: FRFCFS
      refresh_manager:
        impl: AllBank
        scatter_interval: 0
        debug: false
      row_policy:
        impl: Open
      addr_mapper:
        impl: RoBaRaCoCh
      dram:
        impl: DDR4
        org:
          dq: 8
          count: [1, 1, 4, 4, 65536, 1024]
        timing: [1600, 4, 11, 11, 11, 28, 39, 12, 6, 9, 4, 5, 4, 5, 2, 6, 20, 280, 6240, 2, 1250]
        command_cycles: [1, 1, 1, 1, 1, 1, 1, 1]
        channel_width: 64
        read_latency: 15
        timing_constraints:
          - [0, [3, 5], [3, 5], 4]
          - [0, [4, 6], [4, 6], 4]
          - [1, [3, 5], [3, 5], 4]
          - [1, [4, 6], [4, 6], 4]
          - [1, [3, 5], [4, 6], 8]
          - [1, [4, 6], [3, 5], 15]
          - [1, [3, 5], [3, 4, 5, 6], 6, 1, true]
          - [1, [4, 6], [3, 5], 4, 1, true]
          - [1, [3, 5], [2], 6]
          - [1, [4, 6], [2], 25]
          - [1, [0], [0], 4]
          - [1, [0], [0], 20, 4]
          - [1, [0], [2], 28]
          - [1, [2], [0], 11]
          - [1, [0], [7], 39]
          - [1, [1, 2], [7], 11]
          - [1, [5], [7], 17]
          - [1, [6], [7], 36]
          - [1, [7], [0, 2], 280]
          - [2, [3, 5], [3, 5], 5]
          - [2, [4, 6], [4, 6], 5]
          - [2, [4, 6], [3, 5], 19]
          - [2, [0], [0], 5]
          - [3, [0], [0], 39]
          - [3, [0], [3, 4, 5, 6], 11]
          - [3, [0], [1], 28]
          - [3, [1], [0], 11]
          - [3, [3], [1], 6]
          - [3, [4], [1], 25]
          - [3, [5], [0], 17]
          - [3, [6], [0], 36]
